[package]
name = "nids-sniffer"
version = "2.0.0"
edition = "2021"
authors = ["Xebia Project Showcase"]
description = "High-throughput wire-speed network packet sniffer & flow aggregator for NIDS 2.0"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"
chrono = "0.4"
pcap = "2.2.0"
